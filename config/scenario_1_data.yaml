#
# Scenario 1: thermocouple data only, no physics.
#
# Same network and optimizer as in the other scenarios; only the loss differs.
# The physics losses are evaluated for monitoring only.
#
#   python main.py -c config/scenario_1_data.yaml

version: scenario_1_data       # results are written to results/<version>/
seed: 0

configs:                       # shared configuration files
  problem: config/problem.yaml
  network: config/network.yaml
  thermocouples: config/thermocouples.yaml
  reference: data/reference_solution.npz

constraints:
  hard_ic: false               # no physical knowledge built into the network

losses:                        # loss weights, 0 switches a term off
  data: 1.0                    # thermocouple measurements
  pde: 0.0                     # heat equation at collocation points
  ic: 0.0                      # initial condition T = T_0 at t = 0
  bc: 0.0                      # convective boundary condition at the edges

sampling:                      # points for monitoring the physics losses only
  N_col: 4096                  # collocation points, uniform in space-time
  N_source: 0                  # extra collocation points around the moving arc
  source_spread: 2.5           # their std around the arc centre [in units of sigma]
  N_ic: 1024                   # initial-condition points
  N_bc: 1024                   # boundary-condition points

training:                      # Adam warm-up
  N_epochs: 1500
  learning_rate: 0.001
  decay_rate: 0.9              # lr = lr_0 * decay_rate^(epoch / decay_steps)
  decay_steps: 1000
  max_time: null               # optional time budget for the whole training [s]

lbfgs:                         # L-BFGS refinement after Adam (null: Adam only)
  N_steps: 10                  # outer steps, new points in every step
  max_iter: 200                # L-BFGS iterations per step (fixed points)
  learning_rate: 1.0
  history_size: 50
  sampling:                    # more points -> consecutive steps more similar
    N_col: 8192
    N_bc: 2048

logging:
  freq_log: 50                # record logs every n epochs
  freq_print: 50              # print logs every n epochs
  keys_print: [loss_train, loss_test, loss_pde, loss_ic, rmse_val]
