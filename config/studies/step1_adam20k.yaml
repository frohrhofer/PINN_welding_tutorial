#
# Appendix D: Step 1 (data only) with a longer Adam stage (20 000 epochs, no L-BFGS).
#
#   python main.py -c config/studies/step1_adam20k.yaml

version: studies/step1_adam20k
seed: 0
configs:
  problem: config/problem.yaml
  network: config/network.yaml
  thermocouples: config/thermocouples.yaml
  reference: data/reference_solution.npz
constraints:
  hard_ic: false
losses:
  data: 1.0
  pde: 0.0
  ic: 0.0
  bc: 0.0
sampling:
  N_col: 4096
  N_source: 0
  source_spread: 2.5
  N_ic: 1024
  N_bc: 1024
training:
  N_epochs: 20000
  learning_rate: 0.001
  decay_rate: 0.9
  decay_steps: 1000
  max_time: null
lbfgs: null
logging:
  freq_log: 200
  freq_print: 5000
  keys_print:
  - loss_train
  - loss_test
  - loss_pde
  - loss_ic
  - rmse_val
