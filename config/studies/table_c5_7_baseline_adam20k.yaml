#
# Table C5, row 7 and Section 2.4: plain baseline (soft IC, 20 000 Adam epochs, no time limit).
#
#   python main.py -c config/studies/table_c5_7_baseline_adam20k.yaml

version: studies/table_c5_7_baseline_adam20k
seed: 0
configs:
  problem: config/problem.yaml
  network: config/network.yaml
  thermocouples: config/thermocouples.yaml
  reference: data/reference_solution.npz
constraints:
  hard_ic: false
losses:
  data: 0.0
  pde: 1.0
  ic: 1.0
  bc: 1.0
sampling:
  N_col: 4096
  N_ic: 1024
  N_bc: 1024
training:
  N_epochs: 20000
  learning_rate: 0.001
  decay_rate: 0.9
  decay_steps: 1000
logging:
  freq_log: 100
  freq_print: 1000
  keys_print:
  - loss_train
  - loss_pde
  - loss_ic
  - loss_bc
  - loss_test
  - rmse_val
